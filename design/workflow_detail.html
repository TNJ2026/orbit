<!DOCTYPE html>

<html lang="zh-CN"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Orbit Runtime - Workflow Execution Detail</title>
<!-- Tailwind CSS v3 CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Hanken Grotesk -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600;700&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'surface': '#10131a',
            'surface-dim': '#10131a',
            'surface-bright': '#363941',
            'surface-container': '#191b23',
            'surface-container-low': '#191b23',
            'primary': '#3b82f6',
            'accent-orange': '#f97316',
            'accent-green': '#22c55e',
          },
          fontFamily: {
            sans: ['Hanken Grotesk', 'sans-serif'],
          },
          borderRadius: {
            'none': '0',
            'sm': '0.125rem',
            DEFAULT: '4px',
            'md': '0.375rem',
            'lg': '0.5rem',
            'full': '9999px',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-layout">
    body {
      background-color: #10131a;
      color: #e2e8f0;
      font-family: 'Hanken Grotesk', sans-serif;
    }

    /* Custom Scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #10131a;
    }
    ::-webkit-scrollbar-thumb {
      background: #363941;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4b5563;
    }

    /* Workflow Diagram specific styles */
    .workflow-grid {
      background-image: radial-gradient(#1e293b 1px, transparent 1px);
      background-size: 24px 24px;
    }

    .node-connector {
      position: absolute;
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">
<!-- BEGIN: MainHeader -->
<header class="border-b border-white/10 bg-surface-dim px-6 h-16 flex items-center justify-between sticky top-0 z-50">
<div class="flex items-center space-x-10">
<!-- Logo and Brand -->
<div class="flex items-center space-x-2">
<div class="w-8 h-8 bg-primary rounded flex items-center justify-center">
<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</div>
<span class="text-xl font-bold tracking-tight">ORBIT RUNTIME</span>
</div>
<!-- Navigation Links -->
<nav class="hidden md:flex items-center space-x-8">
<a class="text-white/60 hover:text-white transition-colors" href="#">目标</a>
<a class="text-white font-medium" href="#">工作流</a>
<a class="text-white/60 hover:text-white transition-colors" href="#">历史</a>
<a class="text-white/60 hover:text-white transition-colors" href="#">Agent</a>
</nav>
</div>
<!-- User Profile & Actions -->
<div class="flex items-center space-x-4">
<button class="p-2 text-white/60 hover:text-white">
<svg class="w-5 h-5" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<div class="w-8 h-8 rounded-full bg-surface-bright border border-white/20 flex items-center justify-center overflow-hidden">
<img alt="Avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBuJ6xELHviYJ0r7xSBW_u8Kjh7QiZPKiMqiUn1xWaTdFQka-TGscgKSflhs0O6qcdkTVGthB-H6I19z8V42lrWGySNScVu44tDsVMwjzGbiNuK_YKrenNYrlTvC59BIcG7PxRcL_5-_29XoBhBI7Se86J1swS7ZsUq3JcudENXVW3z_R5Lk8xmKqJRj62xvDGIWq7gllmCeTKlvUBVTFWmxqllbtM0bcRzYFN0SRj_DzjdcFuXNgRiTwahC9LWPAYmWY9CrxG9YCU"/>
</div>
</div>
</header>
<!-- END: MainHeader -->
<!-- BEGIN: PageContent -->
<main class="flex-1 flex flex-col p-6 space-y-6 max-w-[1920px] mx-auto w-full">
<!-- BEGIN: WorkflowDetailHeader -->
<section class="flex justify-between items-start" data-purpose="workflow-meta">
<div>
<div class="text-xs text-white/40 font-mono uppercase tracking-widest mb-1">WORKFLOW:DEV-TASK-WORKFLOW</div>
<h1 class="text-2xl font-semibold">Development Task Workflow</h1>
</div>
<button class="px-6 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded text-sm font-medium transition-all">
        关闭
      </button>
</section>
<!-- END: WorkflowDetailHeader -->
<!-- BEGIN: StatsSummary -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-4" data-purpose="workflow-stats">
<div class="bg-surface-container border border-white/5 p-4 rounded-lg">
<div class="text-sm text-white/40 mb-2">节点</div>
<div class="text-2xl font-bold">5</div>
</div>
<div class="bg-surface-container border border-white/5 p-4 rounded-lg">
<div class="text-sm text-white/40 mb-2">输入</div>
<div class="text-2xl font-bold">1</div>
</div>
</section>
<!-- END: StatsSummary -->
<!-- BEGIN: WorkflowExecutionView -->
<section class="flex-1 flex flex-col bg-surface-container border border-white/5 rounded-lg overflow-hidden min-h-[600px]" data-purpose="workflow-diagram-container">
<!-- Tab Bar -->
<div class="flex border-b border-white/5">
<button class="px-6 py-3 text-sm font-medium border-b-2 border-primary text-primary">流程图</button>
<button class="px-6 py-3 text-sm font-medium text-white/40 hover:text-white/60">已发布定义</button>
</div>
<!-- Diagram Area -->
<div class="flex-1 relative workflow-grid overflow-hidden flex items-center justify-center">
<!-- Zoom Controls -->
<div class="absolute top-6 right-6 flex items-center space-x-3 bg-surface-bright/80 backdrop-blur-md px-3 py-1.5 rounded-lg border border-white/10 z-20">
<button class="w-8 h-8 flex items-center justify-center hover:bg-white/10 rounded transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M20 12H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
<span class="text-xs font-medium w-10 text-center">80%</span>
<button class="w-8 h-8 flex items-center justify-center hover:bg-white/10 rounded transition-colors">
<svg class="w-4 h-4" fill="none" stroke="currentColor" viewbox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>
</button>
</div>
<!-- Diagram Canvas Simulation -->
<div class="relative w-full h-full flex items-center justify-start px-12 md:px-24">
<!-- Connections (Simulated SVG) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none" style="z-index: 0;">
<defs>
<marker id="arrowhead" markerheight="7" markerwidth="10" orient="auto" refx="9" refy="3.5">
<polygon fill="#475569" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
<!-- Paths between nodes -->
<path d="M220 300 L280 300" marker-end="url(#arrowhead)" stroke="#475569" stroke-width="2"></path>
<path d="M460 300 L520 300" marker-end="url(#arrowhead)" stroke="#475569" stroke-width="2"></path>
<path d="M720 300 L780 300" marker-end="url(#arrowhead)" stroke="#475569" stroke-width="2"></path>
<path d="M960 300 L1040 300" marker-end="url(#arrowhead)" stroke="#475569" stroke-width="2"></path>
<!-- Feedback Loop Dotted Path -->
<path d="M370 340 L370 380 L120 380 L120 345" fill="none" marker-end="url(#arrowhead)" stroke="#64748b" stroke-dasharray="4,4" stroke-width="1.5"></path>
</svg>
<!-- Nodes Container -->
<div class="relative z-10 flex items-center space-x-14">
<!-- Node 1: Code Dev -->
<div class="w-44 h-24 bg-surface-bright/40 border border-white/10 rounded-lg p-4 flex flex-col justify-between hover:border-white/20 transition-all cursor-pointer" data-purpose="node">
<div>
<div class="text-sm font-medium text-white/90">代码开发</div>
<div class="text-xs text-white/40 mt-1 font-mono">codex</div>
</div>
</div>
<!-- Node 2: Code Review -->
<div class="w-44 h-24 bg-surface-bright/40 border border-white/10 rounded-lg p-4 flex flex-col justify-between hover:border-white/20 transition-all cursor-pointer" data-purpose="node">
<div>
<div class="text-sm font-medium text-white/90">代码评审</div>
<div class="text-xs text-white/40 mt-1 font-mono">claude</div>
</div>
</div>
<!-- Node 3: Manual Approval (Active/Warning) -->
<div class="w-56 h-24 bg-accent-orange/10 border border-accent-orange/50 rounded-lg p-4 flex flex-col justify-between ring-1 ring-accent-orange/20 transition-all cursor-pointer shadow-[0_0_15px_rgba(249,115,22,0.1)]" data-purpose="node-active">
<div>
<div class="text-sm font-medium text-white">人工审批</div>
<div class="text-xs text-accent-orange/80 mt-1 font-mono">human</div>
</div>
<div class="flex justify-end">
<span class="flex h-2 w-2 rounded-full bg-accent-orange animate-pulse"></span>
</div>
</div>
<!-- Node 4: Merge -->
<div class="w-44 h-24 bg-surface-bright/40 border border-white/10 rounded-lg p-4 flex flex-col justify-between hover:border-white/20 transition-all cursor-pointer" data-purpose="node">
<div>
<div class="text-sm font-medium text-white/90">提交合并</div>
<div class="text-xs text-white/40 mt-1 font-mono">pi</div>
</div>
</div>
<!-- Node 5: Success/Finish -->
<div class="w-44 h-24 bg-accent-green/10 border border-accent-green/40 rounded-full p-4 flex items-center justify-center transition-all cursor-pointer shadow-[0_0_15px_rgba(34,197,94,0.1)]" data-purpose="node-complete">
<span class="text-sm font-bold text-accent-green">完成</span>
</div>
</div>
</div>
</div>
</section>
<!-- END: WorkflowExecutionView -->
</main>
<!-- END: PageContent -->
</body></html>
