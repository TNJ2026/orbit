<!doctype html>
<html lang="en" data-product-mode="simplified-goal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Runtime</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- The type system is the reader's own. A Runtime that binds to loopback
       reached a font CDN on every page load: an offline machine got the
       fallback stack anyway, a machine behind a proxy got a hang before it,
       and the request told a third party when this tool was opened. Nothing
       here is loaded from anywhere but this server. -->
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <a class="skip-link" href="#content" data-i18n="app.skipToContent">Skip to main content</a>
  <div class="app">
    <main class="main">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-copy">
            <div data-i18n="app.title">Orbit Runtime</div>
          </div>
        </div>

        <!-- One segmented control rather than four loose buttons: the four
             destinations are one choice, and the shared outline says so the
             way the theme toggle does. The icons are drawn rather than typed —
             a nav that used ⌘ for Workflows and ∆ for Agents was naming them
             with whatever glyph was to hand, and each font sized and baselined
             those differently. Every path below is 16×16, 1.5 stroke,
             currentColor, so the set reads as one family and inherits the
             active colour without a second rule. -->
        <nav class="nav" data-i18n-label="nav.label" aria-label="Main navigation">
          <button class="nav-button" data-view="home"
                  data-i18n-label="nav.home" aria-label="Goal" aria-current="page">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <circle cx="8" cy="8" r="5.75"/>
              <circle cx="8" cy="8" r="2.25"/>
            </svg>
            <span class="nav-label" id="homeNavLabel" data-i18n="nav.home">Goal</span>
          </button>
          <button class="nav-button" data-view="workflows"
                  data-i18n-label="nav.workflows" aria-label="Workflows">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="1.25" y="6" width="4.5" height="4" rx="1.25"/>
              <rect x="10.25" y="1.5" width="4.5" height="4" rx="1.25"/>
              <rect x="10.25" y="10.5" width="4.5" height="4" rx="1.25"/>
              <path d="M5.75 8h2.25M8 3.5v9M8 3.5h2.25M8 12.5h2.25"/>
            </svg>
            <span class="nav-label" data-i18n="nav.workflows">Workflows</span>
          </button>
          <button class="nav-button" data-view="goals"
                  data-i18n-label="nav.goals" aria-label="History">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <path d="M2.4 8a5.6 5.6 0 1 0 1.7-4"/>
              <path d="M1.6 2.2v3.2h3.2"/>
              <path d="M8 5v3.2l2.2 1.3"/>
            </svg>
            <span class="nav-label" data-i18n="nav.goals">History</span>
          </button>
          <button class="nav-button" data-view="agents"
                  data-i18n-label="nav.agents" aria-label="Agents">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="2.25" y="5.25" width="11.5" height="8.5" rx="2.25"/>
              <path d="M8 2.9v2.35"/>
              <circle cx="8" cy="2.1" r="1.1" fill="currentColor" stroke="none"/>
              <circle cx="5.9" cy="9.4" r="1" fill="currentColor" stroke="none"/>
              <circle cx="10.1" cy="9.4" r="1" fill="currentColor" stroke="none"/>
            </svg>
            <span class="nav-label" data-i18n="nav.agents">Agents</span>
          </button>
          <!-- A link, not a view: the editor is its own page with its own
               bundle, so this leaves the shell rather than routing inside it.
               It carries no data-view for that reason, which is also what
               keeps the router's handlers off it. -->
          <a class="nav-button" id="editorNav" href="/editor/"
             data-i18n-label="nav.editor" aria-label="Editor">
            <svg class="nav-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
              <rect x="1.5" y="2.25" width="5" height="4" rx="1.25"/>
              <rect x="9.5" y="9.75" width="5" height="4" rx="1.25"/>
              <path d="M4 6.25v3.25a2 2 0 0 0 2 2h6"/>
              <path d="M10.25 9.5 12 11.75l1.75-2.25" fill="none"/>
            </svg>
            <span class="nav-label" data-i18n="nav.editor">Editor</span>
          </a>
        </nav>

        <div class="topbar-controls">
          <div class="runtime-card-inline" id="runtimeCard" role="status"
               aria-live="polite" data-i18n-label="shell.runtime.checking"
               aria-label="Checking runtime…">
            <span class="live-dot" id="runtimeDot" aria-hidden="true"></span>
          </div>
          <button class="button" id="refresh" data-i18n="action.refresh">Refresh</button>
          <button class="button" id="shutdownRuntime" type="button" hidden
                  data-i18n="runtime.shutdown.action">Stop Orbit</button>
          <!-- Theme, language and refresh interval are secondary settings, so
               they live behind one "More" button instead of crowding the bar. -->
          <div class="more-menu">
            <button class="button more-menu-trigger" id="moreButton" type="button"
                    aria-haspopup="true" aria-expanded="false"
                    data-i18n-label="action.more" aria-label="More settings">⋯</button>
            <div class="more-menu-popover" id="moreMenu" role="menu" hidden>
              <div class="more-menu-row">
                <span class="more-menu-label" data-i18n="settings.theme">Theme</span>
                <div class="theme-toggle" role="group" data-i18n-label="settings.theme" aria-label="Theme">
                  <button class="theme-option" id="themeLight" type="button" data-theme-value="light"
                          data-i18n-label="theme.light" aria-label="Light">☀</button>
                  <button class="theme-option" id="themeDark" type="button" data-theme-value="dark"
                          data-i18n-label="theme.dark" aria-label="Dark">☾</button>
                </div>
              </div>
              <div class="more-menu-row">
                <span class="more-menu-label" data-i18n="settings.language">Language</span>
                <select id="localeSelect" data-i18n-label="locale.switch" aria-label="Change language"></select>
              </div>
              <div class="more-menu-row">
                <span class="more-menu-label" data-i18n="settings.refresh">Live refresh interval</span>
                <select id="refreshInterval" data-i18n-label="settings.refresh" aria-label="Live refresh interval"></select>
              </div>
            </div>
          </div>
        </div>
      </header>
      <!-- The page's one heading: invisible, but a screen reader still hears
           which view it is on. -->
      <h1 id="viewTitle" class="sr-only">Workspace</h1>
      <!-- Command outcomes are announced here rather than shown as a toast, so
           a screen reader hears the same result a sighted operator reads. -->
      <div id="liveRegion" class="banner info" role="status" aria-live="polite" hidden></div>
      <div id="content" class="content"></div>
    </main>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
