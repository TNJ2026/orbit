<!doctype html>
<html lang="en" data-product-mode="simplified-goal">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orbit Runtime</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <!-- DESIGN.md type system: Hanken Grotesk (headlines), Inter (body),
       JetBrains Mono (technical labels). display=swap keeps the fallback
       stack rendering instantly, so an offline local runtime never blocks. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
  <a class="skip-link" href="#content" data-i18n="app.skipToContent">Skip to main content</a>
  <div class="app">
    <main class="main">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true"></div>
          <div class="brand-copy">
            <div data-i18n="app.title">Orbit Runtime</div>
          </div>
        </div>

        <nav class="nav" data-i18n-label="nav.label" aria-label="Main navigation">
          <button class="nav-button" data-view="home" aria-current="page">
            <span class="nav-icon" aria-hidden="true">⌂</span>
            <span id="homeNavLabel" data-i18n="nav.home">Workspace</span>
          </button>
          <button class="nav-button" data-view="workflows">
            <span class="nav-icon" aria-hidden="true">⌘</span>
            <span data-i18n="nav.workflows">Workflows</span>
          </button>
          <button class="nav-button" data-view="goals">
            <span class="nav-icon" aria-hidden="true">◷</span>
            <span data-i18n="nav.goals">History</span>
          </button>
          <button class="nav-button" data-view="agents">
            <span class="nav-icon" aria-hidden="true">∆</span>
            <span data-i18n="nav.agents">Agents</span>
          </button>
        </nav>

        <div class="topbar-controls">
          <div class="runtime-card-inline" id="runtimeCard">
            <span class="live-dot" id="runtimeDot" aria-hidden="true"></span>
            <span id="runtimeStatus" data-i18n="shell.runtime.checking">Checking runtime…</span>
            <span id="runtimeDetail" class="muted"></span>
          </div>
          <button class="button" id="themeToggle" data-i18n-label="theme.toggle" aria-label="Toggle theme">◐</button>
          <button class="button" id="refresh" data-i18n="action.refresh">Refresh</button>
          <select id="localeSelect" data-i18n-label="locale.switch" aria-label="Change language"></select>
          <span class="topbar-refresh-control">
            <label for="refreshInterval" data-i18n="settings.refresh">Live refresh interval</label>
            <select id="refreshInterval" data-i18n-label="settings.refresh" aria-label="Live refresh interval"></select>
          </span>
        </div>
      </header>
      <!-- The page's one heading: invisible, but a screen reader still hears
           which view it is on. -->
      <h1 id="viewTitle" class="sr-only">Workspace</h1>
      <!-- Command outcomes are announced here rather than shown as a toast, so
           a screen reader hears the same result a sighted operator reads. -->
      <div id="liveRegion" class="banner info" role="status" aria-live="polite" hidden></div>
      <div id="content" class="content"></div>
    </main>
  </div>

  <script type="module" src="assets/app.js"></script>
</body>
</html>
