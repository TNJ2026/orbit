name: Harness Integration

on:
  pull_request:
    paths:
      - ".github/workflows/harness.yml"
      - "integrations/deepseek-harness/**"
      - "src/orbit/__main__.py"
      - "src/orbit/platform/runtime_ownership.py"
      - "src/orbit/web/local_identity.py"
      - "src/orbit/web/mcp.py"
      - "tests/test_harness_bundle.py"
      - "tests/test_runtime_ownership.py"
      - "tests/test_security.py"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/harness.yml"
      - "integrations/deepseek-harness/**"
      - "src/orbit/__main__.py"
      - "src/orbit/platform/runtime_ownership.py"
      - "src/orbit/web/local_identity.py"
      - "src/orbit/web/mcp.py"
      - "tests/test_harness_bundle.py"
      - "tests/test_runtime_ownership.py"
      - "tests/test_security.py"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/deepseek-harness/package-lock.json
      - name: Install Orbit
        run: uv sync --extra dev
      - name: Test Runtime ownership and Harness security
        run: >-
          uv run python -m unittest
          tests.test_runtime_ownership
          tests.test_security
          tests.test_harness_bundle
      - name: Test Harness Bundle
        working-directory: integrations/deepseek-harness
        run: |
          npm ci
          npm test
          npm run typecheck
          npm pack --dry-run
