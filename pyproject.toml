[project]
name = "orbit"
dynamic = ["version"]
description = "Local durable workflow runtime for agent work"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Borrowed from starlette until now, but `web.api_v1.common` calls
    # anyio.to_thread.run_sync itself — the same reason pydantic is declared
    # below. Only to_thread is used, which anyio has had since 3.0.
    "anyio>=3.6.2,<5",
    "jsonschema>=4.23",
    # langgraph's own dependency, but `langgraph_runtime.compiler` imports
    # RunnableConfig from it directly, so it is declared here too. The major
    # is pinned to langgraph's, which carries the tighter floor.
    "langchain-core>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3.0,<4",
    # Declared rather than borrowed. langgraph already requires pydantic, so
    # this adds nothing to an install; but `workflow.dsl.models` imports it
    # directly, and a direct import resting on somebody else's dependency is
    # how a transitive bump becomes an unexplained ImportError.
    "pydantic>=2.7,<3",
    "PyYAML>=6.0",
    "starlette>=0.37",
    "uvicorn>=0.29",
    # uvicorn speaks no WebSocket protocol on its own, and without one the
    # authoring event socket is a 404 rather than a push. The endpoint's tests
    # drive ASGI directly and pass without it; a running Runtime does not.
    "websockets>=12",
]

# Test-only. playwright is never imported by the package; the browser suite
# skips when it is absent, so a plain install stays four dependencies deep.
[project.optional-dependencies]
dev = ["playwright>=1.45", "Pillow>=10"]
# Structured workflow authoring against a model API, as an alternative to a
# locally installed Agent CLI. Optional for the same reason playwright is:
# `authoring.structured` imports it when a generator is built, never at module
# import, so a Runtime that only uses discovered CLIs never pulls it in.
structured-authoring = ["pydantic-ai-slim>=0.4"]

[project.scripts]
orbit = "orbit.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth for the version: src/orbit/__init__.py's __version__.
[tool.hatch.version]
path = "src/orbit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit"]
# Non-Python resources (the modular Web UI)
# are loaded via importlib.resources at runtime. hatchling already ships every
# non-ignored file under the package tree, so they are included automatically —
# a force-include table here only duplicates them and makes the wheel build fail
# with "a second file is being added to the wheel archive at the same path".
